[project]
name = "doc-extractor"
version = "0.1.0"
description = "LLM-извлечение структурированных полей из счетов, КП и актов с защитой от галлюцинаций"
authors = [
    { name = "Andas", email = "andassatybaldy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
doc-extractor = "doc_extractor.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Кириллица в строках/комментариях — норма для этого проекта
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
